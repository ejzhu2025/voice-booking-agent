name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: bonchon-voice-agent
  SERVICE: voice-booking-agent
  REGION: us-central1

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          source: .
          env_vars: |
            SQUARE_ENVIRONMENT=production
          secrets: |
            GOOGLE_API_KEY=GOOGLE_API_KEY:latest
            SQUARE_ACCESS_TOKEN=SQUARE_ACCESS_TOKEN:latest
            SQUARE_LOCATION_ID=SQUARE_LOCATION_ID:latest
            TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest
            TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest
            TWILIO_PHONE_NUMBER=TWILIO_PHONE_NUMBER:latest
